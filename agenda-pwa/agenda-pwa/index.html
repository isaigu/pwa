<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda de tareas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f5c">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#17212b;--mut:#5b6773;--line:#d5dce3;--ac:#1f6f5c;--acT:#fff;--alta:#b42318;--media:#b54708;--baja:#1f6f5c}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8edf1;--mut:#97a4b0;--line:#2b3946;--ac:#4cc3a4;--acT:#06231b;--alta:#ff8a80;--media:#ffb866;--baja:#4cc3a4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:1.75rem;letter-spacing:-.02em}
#resumen{color:var(--mut);font-size:.9rem;margin:2px 0 0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#instalar{display:none;background:none;border:1px solid var(--ac);color:var(--ac);border-radius:8px;padding:6px 12px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
form input,form select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
#titulo{grid-column:1/-1}
form button{grid-column:1/-1;background:var(--ac);color:var(--acT);border:0;border-radius:8px;padding:11px;font-weight:600}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;background:none;border:1px solid var(--line);border-radius:8px;padding:7px}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--p);border-radius:10px;padding:10px 12px}
li.alta{--p:var(--alta)}li.media{--p:var(--media)}li.baja{--p:var(--baja)}
li input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.tx{flex:1;min-width:0;overflow-wrap:anywhere}
.tx small{display:block;color:var(--mut)}
.tx small.venc{color:var(--alta);font-weight:600}
li.hecha .tx b{text-decoration:line-through;color:var(--mut);font-weight:400}
li .del{background:none;border:0;color:var(--mut);font-size:1.3rem;padding:4px 8px}
.vacio{text-align:center;color:var(--mut);padding:32px 0}
</style></head><body><main>
<header><div><h1>Agenda de tareas</h1><p id="resumen"></p></div><button id="instalar" type="button">Instalar</button></header>
<form id="f">
<input id="titulo" placeholder="¿Qué tienes que hacer?" required maxlength="120" aria-label="Tarea">
<input id="fecha" type="date" aria-label="Fecha límite">
<select id="prio" aria-label="Prioridad"><option value="media">Prioridad media</option><option value="alta">Prioridad alta</option><option value="baja">Prioridad baja</option></select>
<button>Agregar tarea</button>
</form>
<nav id="nav"><button data-f="todas" aria-pressed="true">Todas</button><button data-f="pendientes" aria-pressed="false">Pendientes</button><button data-f="hechas" aria-pressed="false">Hechas</button></nav>
<ul id="lista"></ul>
</main>
<script>
const KEY='agenda.tareas.v1';
let tareas=[],filtro='todas';
try{tareas=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const $=s=>document.querySelector(s);
const guardar=()=>{try{localStorage.setItem(KEY,JSON.stringify(tareas))}catch(e){}};
const hoy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const orden={alta:0,media:1,baja:2};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
  const pend=tareas.filter(t=>!t.hecha).length;
  $('#resumen').textContent=tareas.length?`${pend} pendiente${pend===1?'':'s'} de ${tareas.length}`:'Sin tareas todavía';
  const v=tareas.filter(t=>filtro==='todas'||(filtro==='hechas')===t.hecha)
    .sort((a,b)=>a.hecha-b.hecha||(a.fecha||'9').localeCompare(b.fecha||'9')||orden[a.prio]-orden[b.prio]);
  const ul=$('#lista');ul.replaceChildren();
  if(!v.length){const li=el('li','vacio','Nada por aquí. Escribe una tarea arriba y pulsa «Agregar tarea».');li.style.display='block';li.style.border='0';ul.append(li);return}
  for(const t of v){
    const li=el('li',t.prio+(t.hecha?' hecha':''));
    const cb=el('input');cb.type='checkbox';cb.checked=t.hecha;cb.setAttribute('aria-label','Marcar como hecha');
    cb.onchange=()=>{t.hecha=cb.checked;guardar();render()};
    const tx=el('div','tx');tx.append(el('b','',t.titulo));
    if(t.fecha){const d=new Date(t.fecha+'T00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
      tx.append(el('small',!t.hecha&&t.fecha<hoy()?'venc':'',(!t.hecha&&t.fecha<hoy()?'Vencida · ':'')+d))}
    const del=el('button','del','×');del.type='button';del.setAttribute('aria-label','Eliminar tarea');
    del.onclick=()=>{tareas=tareas.filter(x=>x.id!==t.id);guardar();render()};
    li.append(cb,tx,del);ul.append(li);
  }
}
$('#f').onsubmit=e=>{e.preventDefault();
  const titulo=$('#titulo').value.trim();if(!titulo)return;
  tareas.push({id:Date.now(),titulo,fecha:$('#fecha').value,prio:$('#prio').value,hecha:false});
  guardar();e.target.reset();render();$('#titulo').focus()};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;filtro=b.dataset.f;
  document.querySelectorAll('#nav button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
let ev;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;$('#instalar').style.display='block'});
$('#instalar').onclick=async()=>{if(!ev)return;ev.prompt();await ev.userChoice;ev=null;$('#instalar').style.display='none'};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
